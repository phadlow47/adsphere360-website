<script>
  // Forward old WordPress addresses (and trailing-slash variants) to the new pages.
  (function () {
    var p = location.pathname.replace(/\/+$/, '').toLowerCase();
    var map = {
      '/about': '/company', '/about-us': '/company', '/team': '/company',
      '/services': '/publishers', '/blog': '/', '/home': '/',
      '/contact': '/contact', '/contact-us': '/contact',
      '/privacy-policy': '/privacy-policy', '/privacy': '/privacy-policy',
      '/publishers': '/publishers', '/demand': '/demand', '/technology': '/technology', '/company': '/company'
    };
    var dest = map[p];
    if (!dest && p.indexOf('/blog/') === 0) dest = '/';
    if (dest && dest !== location.pathname) location.replace(dest + location.hash);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
